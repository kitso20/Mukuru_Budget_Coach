<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Mukuru Budget Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>
<main class="dash">
    <h1 data-i18n="dashTitle"></h1>

    <section class="stats" id="stats" aria-live="polite"></section>

    <div class="dash-grid">
        <section>
            <h2 data-i18n="envTitle"></h2>
            <div id="envelopes" class="envelopes"></div>
        </section>
        <aside>
            <h2 data-i18n="adviceTitle"></h2>
            <ul id="advice" class="advice"></ul>
        </aside>
    </div>
</main>

<script type="module" src="Dashboard.js"></script>
</body>
</html>
