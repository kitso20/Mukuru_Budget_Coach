<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add transaction</title>
    <link rel="stylesheet" href="AddTransaction.css">
</head>
<body>
<main class="card">
    <h2>Add transaction</h2>

    <form id="transaction-form" novalidate>
        <label for="amount">Amount (R)</label>
        <input id="amount" type="number" inputmode="decimal" min="0" step="0.01">

        <label for="merchant">Merchant</label>
        <input id="merchant" type="text" placeholder="e.g. Shoprite">

        <label for="recipient">Recipient (optional)</label>
        <input id="recipient" type="text">

        <label for="date">Date</label>
        <input id="date" type="date">

        <label for="category">Category</label>
        <select id="category">
            <option value="">Auto-detect</option>
        </select>

        <button type="submit" id="submit-btn">Add transaction</button>
    </form>

    <p id="status" role="status"></p>
</main>

<script type="module" src="AddTransaction.js"></script>
</body>
</html>
